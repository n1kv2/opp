<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEBFF">
<title>CEnTRO · Questionario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F9; --card:#fff; --ink:#15151c; --soft:#4a4a57; --muted:#8a8a97;
  --line:#E7E7EE; --line2:#D6D6E0; --accent:#4b2ad6; --ok:#1f9d63; --warn:#d98a12; --bad:#d2453c;
  --grad:linear-gradient(90deg,#F06139,#D43998 30%,#8B1EBA 65%,#1E42BA);
  --r:18px; --gut:clamp(14px,4.6vw,20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E4E4EB;color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  text-size-adjust:100%;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 20px 60px rgba(20,20,40,.14)}}

/* ---------- città ---------- */
.cityWrap{position:relative;flex:0 0 auto;height:clamp(120px,24dvh,200px);background:#EDEBFF;overflow:hidden;touch-action:pan-y;
  transition:height .5s cubic-bezier(.2,.8,.2,1)}
.cityWrap.tall{height:clamp(150px,32dvh,260px)}
@media (max-height:640px){.cityWrap{height:112px}.cityWrap.tall{height:140px}}
#city{width:100%;height:100%;display:block}
.hud{position:absolute;left:var(--gut);right:var(--gut);top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{display:inline-flex;align-items:center;background:rgba(255,255,255,.9);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--soft)}
.chip b{color:var(--ink)}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,.9,.25,1)}
.crane{transition:transform .8s cubic-bezier(.2,.9,.25,1),opacity .4s}
.win{fill:#fff;fill-opacity:.4;transition:fill .6s,fill-opacity .6s}
.win.lit{fill:#FFD98A;fill-opacity:1}
.lamp{fill:#fff;fill-opacity:.6;transition:fill .5s}.lamp.lit{fill:#FFD98A;fill-opacity:1}
.pop{animation:pop .5s ease}
@keyframes pop{0%{filter:brightness(1)}40%{filter:brightness(1.25)}100%{filter:brightness(1)}}

/* ---------- barra alta ---------- */
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px var(--gut) 0}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:19px;height:19px}
.topmid{flex:1;min-width:0}
.topmid .t{display:none}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);background-size:480px 100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- stage ---------- */
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px var(--gut) 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{animation:in .3s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;min-height:100%}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow1{flex:1}
.mid{display:flex;flex-direction:column;justify-content:center}
h1{font-size:clamp(24px,7vw,30px);line-height:1.12;margin:0 0 8px;letter-spacing:-.025em}
h2{font-size:17px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 0 10px;line-height:1.45;color:var(--soft)}
.muted{color:var(--muted)}.small{font-size:13px}
.lead{font-size:clamp(17px,4.8vw,19px);line-height:1.45;color:var(--ink);font-weight:600}
.count{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(20px,5.8vw,24px);line-height:1.3;font-weight:800;letter-spacing:-.015em;margin:10px 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.foot{position:sticky;bottom:0;margin:12px calc(var(--gut) * -1) 0;padding:12px var(--gut) calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(246,246,249,0))}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;background:var(--ink);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.22}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.row{display:flex;gap:10px}.row>*{flex:1}.row>.ghost{flex:.8}

/* ---------- scelta aree ---------- */
.part{margin:22px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.part span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.part button{font-size:13px;font-weight:800;color:var(--accent);padding:6px 0}
.area{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;border:1.5px solid var(--line);width:100%;text-align:left;transition:border-color .2s,background .2s;min-height:64px}
.area.on{border-color:var(--ink)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.area.on .chk{background:var(--ink);border-color:var(--ink)}
.chk svg{width:13px;height:13px;stroke:#fff;opacity:0}.area.on .chk svg{opacity:1}
.area .nm{font-weight:800;font-size:15.5px}.area .ds{font-size:13px;color:var(--muted);margin-top:2px}
.area .st{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.area .st.done{color:var(--ok)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:700;font-size:15px}
.toggle:last-child{border:0}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line2);flex:0 0 auto;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ink)}.sw.on::after{transform:translateX(18px)}

/* ---------- scala ---------- */
.scale{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y;outline:none}
.faces{display:grid;grid-template-columns:repeat(5,1fr)}
.face{display:grid;place-items:center;padding:6px 0;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.face svg{width:min(52px,13.4vw);height:min(52px,13.4vw)}
.face.sel{transform:scale(1.22)}
.face .n{font-size:16px;font-weight:800;color:var(--muted);width:min(48px,12.4vw);height:min(48px,12.4vw);border-radius:50%;display:grid;place-items:center;background:#EEEEF3}
.face.sel .n{color:#fff}
.rail{position:relative;height:28px;margin:4px 10% 0}
.rail::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:9px;background:var(--line)}
.fill{position:absolute;left:0;top:12px;height:4px;border-radius:9px;background:var(--ink);width:0;transition:width .25s cubic-bezier(.2,.8,.2,1)}
.dot{position:absolute;top:10px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;border:2px solid var(--line2)}
.thumb{position:absolute;top:3px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:4px solid var(--ink);opacity:0;transform:scale(.4);transition:left .22s cubic-bezier(.2,.9,.3,1.2),opacity .2s,transform .2s}
.scale.has .thumb{opacity:1;transform:none}
.scale.drag .thumb{transition:opacity .2s,transform .2s;transform:scale(1.15)}
.scale.drag .fill{transition:none}
.ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:10px;gap:12px}
.ends span:last-child{text-align:right}
.pill{display:block;text-align:center;margin:20px auto 0;min-height:24px;font-weight:800;font-size:17px}
.pill.empty{visibility:hidden}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;border-radius:15px;background:#fff;border:1.5px solid var(--line);margin-bottom:8px;font-weight:700;font-size:16px;line-height:1.25;transition:.15s;min-height:56px}
.opt:active{transform:scale(.99)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto;display:grid;place-items:center}
.opt.multi .rd{border-radius:7px}
.opt.sel{border-color:var(--ink)}
.opt.sel .rd{background:var(--ink);border-color:var(--ink)}
.opt .rd svg{width:12px;height:12px;stroke:#fff;opacity:0}.opt.sel .rd svg{opacity:1}
.hint{font-size:13px;color:var(--muted);margin:-14px 0 12px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
textarea{width:100%;min-height:170px;border-radius:15px;border:1.5px solid var(--line2);padding:14px;font:inherit;font-size:16px;resize:vertical;background:#fff;outline:none}
textarea:focus{border-color:var(--ink)}

/* ---------- interessi ---------- */
.int{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.int .h{font-weight:800;font-size:15px;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#F0F0F5;border-radius:12px;padding:3px}
.seg button{border-radius:9px;padding:10px 2px;font-size:12px;font-weight:800;color:var(--soft);line-height:1.1;transition:.15s;min-height:40px}
.seg button.sel{color:#fff;background:var(--ink)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.subs button{padding:8px 12px;border-radius:99px;font-size:13px;font-weight:700;background:#F0F0F5}
.subs button.sel{background:var(--ink);color:#fff}
.subs .lbl{font-size:12.5px;color:var(--muted);width:100%}

/* ---------- blocco completato ---------- */
.check{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 18px;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{from{transform:scale(.4);opacity:0}}
.center{text-align:center}

/* ---------- sommario ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:-18px calc(var(--gut) * -1) 10px;padding:12px var(--gut) 10px;scrollbar-width:none;position:sticky;top:-18px;z-index:5;background:linear-gradient(to bottom,var(--bg) 82%,rgba(246,246,249,0))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sec{margin:0 0 14px}
.sec>h2{margin:20px 2px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.sc .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc .nm{font-weight:800;font-size:15px}
.sc .val{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;border-radius:9px;background:var(--line);margin:18px 0 10px}
.track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--line2)}
.mk{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .8s cubic-bezier(.2,.9,.25,1)}
.mk.ideal{background:#fff;border:3px solid var(--ink)}
.mk.low{background:repeating-linear-gradient(45deg,#9a9aa4 0 3px,#fff 3px 6px)}
.poles{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.poles span:last-child{text-align:right}
.band{font-size:13.5px;font-weight:700;margin-top:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:#F0F0F5;color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.ok{background:rgba(31,157,99,.12);color:var(--ok)}.tag.warn{background:rgba(217,138,18,.14);color:var(--warn)}.tag.bad{background:rgba(210,69,60,.12);color:var(--bad)}
.na{color:var(--muted);font-size:13.5px;margin-top:8px}
.ans{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.ans:last-child{border:0}
.ans .c{flex:0 0 42px;font-size:12px;font-weight:800;color:var(--muted);padding-top:2px}
.ans .q{flex:1;font-size:14.5px;line-height:1.35;font-weight:600}
.ans .a{display:block;margin-top:3px;font-weight:800;color:var(--accent);font-size:14px}
.ans .a em{font-style:normal;color:var(--muted);font-weight:700}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted);font-weight:600}.kv span:last-child{font-weight:800;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{padding:5px 10px;border-radius:99px;background:#F0F0F5;font-size:13px;font-weight:700}
.note{font-size:13px;line-height:1.4;color:var(--muted);margin:10px 2px}
.pad{height:24px}

.grp{padding:2px 16px}
.rw{padding:14px 0;border-bottom:1px solid var(--line)}.rw:last-child{border:0}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rh .nm{font-weight:800;font-size:15px}
.verd{font-weight:800;font-size:14px;white-space:nowrap}.verd em{font-style:normal;color:var(--muted);font-weight:700;margin-left:4px;font-size:13px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:1px}.cdot.warn{background:var(--warn)}.cdot.bad{background:var(--bad)}
.bf{position:absolute;top:0;height:100%;border-radius:9px;background:var(--ink);opacity:.85;left:50%;width:0;transition:left .8s cubic-bezier(.2,.9,.25,1),width .8s cubic-bezier(.2,.9,.25,1)}
.hl{padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--soft)}.hl b{color:var(--ink)}
.radar{width:100%;height:auto;display:block}
.rw .track{margin:14px 0 8px}

</style>
</head>
<body>
<div id="app">
  <div class="cityWrap tall" id="cityWrap"><svg id="city" aria-hidden="true"></svg><div class="hud" id="hud"></div></div>
  <div class="top">
    <button class="iconbtn" id="backBtn" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="topmid"><div class="t" id="topTitle"></div><div class="bar"><i id="topBar"></i></div></div>
    <button class="iconbtn" id="menuBtn" aria-label="Scegli le aree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <main class="stage" id="stage"></main>
</div>

<script>
/* La città che cresce: ogni blocco è un quartiere, ogni risposta fa salire un edificio. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const H = 170, G = 148;             // altezza vista e linea del suolo
  const STOPS = ['#F06139', '#D43998', '#BB2DCE', '#8B1EBA', '#471EBA', '#1E42BA'];
  const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const toHex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const x = hex2(a), y = hex2(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); };
  const shade = (h, t) => t < 0 ? mix(h, '#000000', -t) : mix(h, '#ffffff', t);
  const gradColor = t => { const p = t * (STOPS.length - 1), i = Math.min(STOPS.length - 2, Math.floor(p)); return mix(STOPS[i], STOPS[i + 1], p - i); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

  const HEIGHT = { tower: [78, 100], low: [34, 46], saw: [40, 52], dome: [52, 64], arch: [56, 74], gable: [42, 58], kiosk: [24, 30], house: [46, 62], block: [66, 88], light: [96, 96] };

  /* forme semplici e pulite: suolo a y=0, si sale verso valori negativi */
  function shapeSVG(kind, w, h, c) {
    const dk = shade(c, -.16), lt = shade(c, .3), wins = [];
    const R = (x, y, ww, hh, f, rx = 3) => `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${rx}" fill="${f}"/>`;
    const grid = (top, bottom, pad = 5) => {
      const cols = Math.max(1, Math.floor((w - pad * 2 + 3) / 9)), rows = Math.max(1, Math.floor((bottom - top) / 13));
      const gx = (w - (cols * 9 - 3)) / 2;
      for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) wins.push([gx + q * 9, -bottom + 4 + r * 13, 6, 8]);
    };
    const roof = (o = 3, up = 14) => `<path d="M${-o} ${-h}L${w / 2} ${-h - up}L${w + o} ${-h}Z" fill="${dk}"/>`;
    let s = '';
    switch (kind) {
      case 'tower': s = R(0, -h, w, h, c); grid(6, h - 6); break;
      case 'low': s = R(0, -h, w, h, c) + R(-2, -h - 3, w + 4, 4, dk, 2); grid(8, h - 8); break;
      case 'saw': s = R(0, -h, w, h, c) + `<path d="M0 ${-h}L${w} ${-h - 9}V${-h}Z" fill="${dk}"/>`; grid(6, h - 6); break;
      case 'dome': s = R(0, -h, w, h, c) + `<path d="M${w * .08} ${-h}A${w * .42} ${w * .42} 0 0 1 ${w * .92} ${-h}Z" fill="${dk}"/>`; grid(8, h - 8); break;
      case 'arch': s = R(0, -h, w, h, c) + roof(2, 12) + R(w / 2 - 4, -13, 8, 13, lt, 4); grid(6, h - 16); break;
      case 'gable': s = R(0, -h, w, h, c) + roof(3, 14) + R(w / 2 - 3.5, -12, 7, 12, lt, 2); grid(6, h - 16); break;
      case 'kiosk': s = R(0, -h, w, h, c) + R(-3, -h - 3, w + 6, 5, dk, 2) + R(4, -h + 6, w - 8, 8, lt, 2); break;
      case 'house': s = R(0, -h, w, h, c) + roof(4, 16) + R(w / 2 - 4, -14, 8, 14, lt, 3); grid(10, h - 16); break;
      case 'block': s = R(0, -h, w, h, c) + R(-2, -h - 3, w + 4, 4, dk, 2); grid(4, h - 4); break;
      case 'light':
        s = `<path d="M${w * .2} 0L${w * .32} ${-h}H${w * .68}L${w * .8} 0Z" fill="${c}"/>` + R(w * .3, -h - 9, w * .4, 9, dk, 2) +
          `<circle class="win lamp-l" cx="${w / 2}" cy="${-h - 4.5}" r="3"/>`; break;
    }
    return { svg: s, wins };
  }

  const City = {
    init(svg, blocks) {
      this.svg = svg; this.blocks = blocks; this.cx = 0; this.scale = 1; this.g = 0;
      svg.innerHTML = '';
      const defs = el('defs', {}, svg);
      const sky = el('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      this.s1 = el('stop', { offset: 0, 'stop-color': '#EDEBFF' }, sky);
      this.s2 = el('stop', { offset: 1, 'stop-color': '#F6EEFA' }, sky);
      this.skyR = el('rect', { x: 0, y: 0, width: 400, height: H, fill: 'url(#sky)' }, svg);
      this.sunG = el('g', {}, svg);
      el('circle', { r: 10, fill: '#FFD98A' }, this.sunG);
      this.far = el('g', {}, svg); this.mid = el('g', {}, svg);
      this.world = el('g', {}, svg);
      this.layout();
      this.resize();
    },

    layout() {
      const r = rng(11), w0 = this.world; w0.innerHTML = '';
      this.ground = el('rect', { x: -400, y: G, width: 4000, height: 80, fill: '#DCDCE8' }, w0);
      el('rect', { x: -400, y: G, width: 4000, height: 4, fill: '#C9C9DB' }, w0);
      let x = 40; this.districts = {}; this.blds = [];
      this.blocks.forEach((b, bi) => {
        const col = gradColor(bi / (this.blocks.length - 1)), d = { id: b.id, x0: x - 12, blds: [], color: col, maxH: 0 };
        const dg = el('g', {}, w0); d.g = dg;
        for (let i = 0; i < b.nb; i++) {
          const kind = b.shape, hr = HEIGHT[kind];
          const w = kind === 'light' ? 26 : kind === 'kiosk' ? 24 : Math.round(22 + r() * 10);
          const h = Math.round(hr[0] + r() * (hr[1] - hr[0]));
          const c = shade(col, (r() - .5) * .3);
          const og = el('g', { transform: `translate(${x} ${G})` }, dg);
          el('rect', { x: -2, y: -h, width: w + 4, height: h, rx: 3, fill: 'none', stroke: '#B9B7D6', 'stroke-opacity': .8, 'stroke-dasharray': '3 3', class: 'lot' }, og);
          const gg = el('g', { class: 'grow', style: 'transform:scaleY(0.0001);opacity:0' }, og);
          const sh = shapeSVG(kind, w, h, c);
          gg.innerHTML = sh.svg;
          const lightWin = gg.querySelector('.lamp-l');
          const winEls = sh.wins.map(([wx, wy, ww, wh]) => { const e = el('rect', { x: wx, y: wy, width: ww, height: wh, rx: 1.2, class: 'win' }, gg); e.__lit = r() < .78; return e; });
          const crane = el('g', { class: 'crane', style: 'opacity:0' }, og);
          // gru: traliccio giallo, braccio con contrappeso e gancio con carico (non deve sembrare un lampione)
          el('path', { d: 'M-2.5 0V-32M2.5 0V-32M-2.5 -4L2.5 -9M2.5 -9L-2.5 -14M-2.5 -14L2.5 -19M2.5 -19L-2.5 -24M-2.5 -24L2.5 -29', stroke: '#F2B233', 'stroke-width': 1.1, fill: 'none', 'stroke-linecap': 'round' }, crane);
          el('path', { d: 'M-10 -33H22M-2.5 -32L-10 -33M2.5 -32L19 -33', stroke: '#F2B233', 'stroke-width': 1.6, fill: 'none', 'stroke-linecap': 'round' }, crane);
          el('rect', { x: -13, y: -37, width: 6, height: 5, fill: '#5a5470' }, crane);
          el('path', { d: 'M17 -33V-22', stroke: '#2b2740', 'stroke-width': .8 }, crane);
          el('rect', { x: 14.5, y: -22, width: 5, height: 4, fill: '#e2553a' }, crane);
          const bo = { g: og, grow: gg, crane, winEls, lightWin, lot: og.firstChild, x, w, h, blk: b.id, i };
          d.blds.push(bo); this.blds.push(bo); d.maxH = Math.max(d.maxH, h + (kind === 'light' ? 20 : kind === 'tower' ? 22 : 18));
          x += w + 5 + Math.round(r() * 5);
        }
        d.x1 = x + 8;
        // lampione + albero + insegna
        const lampX = x + 2, tr = el('g', { transform: `translate(${lampX + 12} ${G})` }, dg);
        d.tree = el('g', { class: 'grow', style: 'transform:scaleY(0.0001)' }, tr);
        el('rect', { x: -1.2, y: -12, width: 2.4, height: 12, fill: '#5c4a3a' }, d.tree);
        el('circle', { cx: 0, cy: -18, r: 9, fill: '#5bb37f' }, d.tree); el('circle', { cx: -5, cy: -14, r: 6, fill: '#4aa06d' }, d.tree); el('circle', { cx: 5, cy: -15, r: 6, fill: '#6fc48f' }, d.tree);
        const lp = el('g', { transform: `translate(${lampX} ${G})` }, dg);
        el('path', { d: 'M0 0V-26H6', stroke: '#9b98b8', 'stroke-width': 1.6, fill: 'none' }, lp);
        d.lamp = el('circle', { cx: 6, cy: -24, r: 3.2, class: 'lamp' }, lp);
        d.x1 = lampX + 26; x = d.x1 + 6;
        this.districts[b.id] = d;
      });
      this.totalW = x + 30;
      // colline in parallasse
      const hill = (f, base, amp, fill, op) => {
        const g = f === .15 ? this.far : this.mid; g.innerHTML = '';
        const w = this.totalW * f + 1200; let d = `M-400 ${G}`;
        for (let px = -400; px <= w; px += 20) d += `L${px} ${G - base - amp * (Math.sin(px / 70 * (f < .2 ? .7 : 1)) * .6 + Math.sin(px / 33 + f * 9) * .4)}`;
        el('path', { d: d + `L${w} ${G}Z`, fill, 'fill-opacity': op }, g);
      };
      hill(.35, 16, 12, '#D4D2EE', .9);
    },

    resize() {
      const r = this.svg.getBoundingClientRect(); if (!r.width) return;
      this.vbW = H * r.width / r.height;
      this.svg.setAttribute('viewBox', `0 0 ${this.vbW} ${H}`);
      this.skyR.setAttribute('width', this.vbW);
      this.setSun(this.g);
      this.camera(this.cx, this.scale, 0);
    },

    setSun(g) {
      const w = this.vbW || 300;
      this.sunG.style.transition = 'transform 1.2s ease';
      this.sunG.style.transform = `translate(${w * (.18 + .64 * g)}px, ${112 - 68 * Math.sin(g * Math.PI / 2)}px)`;
    },

    camera(cx, scale, dur = 1000, ease = 'cubic-bezier(.3,.8,.2,1)') {
      this.cx = cx; this.scale = scale;
      const t = `transform ${dur}ms ${ease}`;
      [this.world, this.far, this.mid].forEach(g => g.style.transition = t);
      this.world.style.transformOrigin = '0 0';
      this.world.style.transform = `translate(${this.vbW / 2}px, ${G}px) scale(${scale}) translate(${-cx}px, ${-G}px)`;
      this.far.style.transform = `translate(${-cx * .15 * scale}px,0)`;
      this.mid.style.transform = `translate(${-cx * .35 * scale}px,0)`;
    },

    focus(id, dur) {
      const d = this.districts[id]; if (!d) return;
      const wd = d.x1 - d.x0, s = clamp(Math.min(this.vbW * .94 / wd, 112 / d.maxH), .8, 1.55);
      this.camera((d.x0 + d.x1) / 2, s, dur);
    },

    /* prog: {id: 0..1}; g: avanzamento complessivo 0..1 */
    render(prog, g) {
      this.g = g;
      this.s1.setAttribute('stop-color', mix('#EDEBFF', '#DDEBFF', g));
      this.s2.setAttribute('stop-color', mix('#F6EEFA', '#FFF1E0', g));
      this.setSun(g);
      this.blocks.forEach(b => {
        const d = this.districts[b.id], pr = clamp(prog[b.id] || 0, 0, 1), n = d.blds.length;
        d.blds.forEach((bo, i) => {
          const p = clamp(pr * n - i, 0, 1);
          const prev = bo.p; bo.p = p;
          bo.grow.style.transform = `scaleY(${Math.max(p, .0001)})`;
          bo.grow.style.opacity = p > 0 ? 1 : 0;
          bo.lot.style.opacity = p >= 1 ? 0 : 1;
          const building = p > 0 && p < 1;
          bo.crane.style.opacity = building ? 1 : 0;
          bo.crane.style.transform = `translate(${bo.w * .72}px, ${-bo.h * p}px)`;
          bo.winEls.forEach(w => w.classList.toggle('lit', p >= 1 && w.__lit));
          if (bo.lightWin) bo.lightWin.classList.toggle('lit', p >= 1);
          if (prev !== undefined && p > prev) { bo.grow.classList.remove('pop'); void bo.grow.getBoundingClientRect(); bo.grow.classList.add('pop'); }
        });
        d.tree.style.transform = `scaleY(${Math.max(clamp(pr * 1.4, 0, 1), .0001)})`;
        d.lamp.classList.toggle('lit', pr >= 1);
      });
    },

    overview(startId) {
      this.panning = true;
      const s = clamp(this.vbW / 300 * .85, .6, .95);
      this.camera(Math.max(this.vbW / 2 / s, 60), s, 0);
      requestAnimationFrame(() => { if (this.panning) this.camera(this.totalW - this.vbW / 2 / s, s, 22000, 'linear'); });
    },
    stopPan() {
      if (!this.panning) return; this.panning = false;
      const m = new DOMMatrix(getComputedStyle(this.world).transform);
      this.camera(this.cxFromMatrix(m), this.scale, 0);
    },
    cxFromMatrix(m) { // world: translate(vbW/2,G) scale(s) translate(-cx,-G)  =>  e = vbW/2 - s*cx
      return (this.vbW / 2 - m.e) / this.scale;
    },
    drag(dx) {   // dx in px dello schermo
      const r = this.svg.getBoundingClientRect(), k = this.vbW / r.width;
      let cx = this.cx - dx * k / this.scale;
      cx = clamp(cx, 0, this.totalW);
      this.camera(cx, this.scale, 0);
    },
    colorOf(id) { return this.districts[id].color; }
  };
  window.City = City;
})();

<script>
/* Punteggi e indicatori di qualità, secondo Questionario_CEnTRO_v0.4 (sez. 7 e 9).
   Nessuna norma: si descrive la posizione sulla scala, non si classifica la persona. */
(function () {
  const Q = window.QDATA, C = window.CFG;
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const minFor = n => n >= 6 ? 5 : n === 4 ? 3 : 2;          // sez. 7.1: 6→5, 4→3, 3→2, 2→2
  const isLik = q => q.fmt === 'L5';

  /* sez. 7.2: media degli item validi dopo l'inversione (6−x), poi 25 × (S − 1) */
  function scoreItems(items, ans) {
    const vals = [], plus = [], rev = [];
    items.forEach(q => {
      const a = ans[q.code]; if (a == null) return;
      const isR = q.key === 'R', x = isR ? 6 - a : a;
      vals.push(x); (isR ? rev : plus).push(x);
    });
    const total = items.length, min = minFor(total);
    if (vals.length < min) return { avail: false, n: vals.length, total, min };
    const mean = avg(vals);
    /* coerenza interna: distanza tra la media degli item + e quella degli item R (già invertiti) */
    const gap = plus.length && rev.length ? Math.abs(avg(plus) - avg(rev)) : null;
    return { avail: true, score: 25 * (mean - 1), mean, n: vals.length, total, gap,
      coh: gap == null ? null : gap > 2 ? 'bassa' : gap > 1 ? 'media' : 'alta' };
  }

  const scaleQs = (block, re) => Q.filter(q => q.block === block && !q.pilot && re.test(q.code));

  function scales(ans) {
    return C.scales.map(sc => Object.assign({ def: sc }, scoreItems(scaleQs(sc.block, sc.re), ans)));
  }
  /* sez. 7.4: indice = 100 × (x_b − x_a + 4) / 8, senza inversione */
  function prefs(ans) {
    return C.prefs.map(p => {
      const a = ans[p.id + 'a'], b = ans[p.id + 'b'];
      return Object.assign({ def: p }, a == null || b == null ? { avail: false } : { avail: true, score: 100 * (b - a + 4) / 8, a, b });
    });
  }
  function home(ans) {
    return C.areas.map(ar => {
      const live = scoreItems(scaleQs('B1', new RegExp('^' + ar.pre + '\\d$')), ans);
      const ideal = scoreItems(scaleQs('B3', new RegExp('^' + ar.amb + '\\d$')), ans);
      const imp = ans['IMP' + (C.areas.indexOf(ar) < 2 ? C.areas.indexOf(ar) + 1 : C.areas.indexOf(ar) + 2)]; // IMP3 è il fumo
      return { def: ar, live, ideal, imp: imp == null ? null : imp };
    });
  }
  const band = s => s <= 33 ? 0 : s <= 66 ? 1 : 2;

  /* fumo (sez. 8.3): C = comportamento, R = regola accettata */
  function smoking(ans) {
    const f1 = ans.FU1, f2 = ans.FU2, f3 = ans.FU3;
    const c = f1 == null ? null : f1 === 0 ? -1 : (f2 == null ? null : f2);
    return { c, r: f3 == null ? null : f3, f1, f2, f3 };
  }

  /* indicatori di qualità delle risposte (sez. 7.6): soglie provvisorie, da stimare sul pilota */
  function quality(S, sc) {
    const ans = S.answers, out = { flags: [], items: [] };
    const add = (label, value, state, note) => out.items.push({ label, value, state, note: note || '' });
    let failed = false;
    [['AT1', 4], ['AT2', 2]].forEach(([c, ok]) => {
      if (ans[c] == null) return;
      const good = ans[c] === ok; if (!good) { failed = true; out.flags.push('domanda di attenzione ' + c + ' sbagliata'); }
      add('Domanda di attenzione ' + c, good ? 'Corretta' : 'Errata', good ? 'ok' : 'bad');
    });
    [['SR1', 'Autovalutazione parte A'], ['SR2', 'Autovalutazione parte B']].forEach(([c, l]) => {
      if (ans[c] == null) return;
      const v = ['Sì', 'In parte', 'No'][ans[c]]; const st = ans[c] === 0 ? 'ok' : ans[c] === 1 ? 'warn' : 'bad';
      if (ans[c] === 2) out.flags.push(l + ': «No»');
      add(l + ' (' + c + ')', v, st);
    });
    const im = ['IM1', 'IM2', 'IM3', 'IM4', 'IM5', 'IM6'];
    if (im.every(c => ans[c] != null)) {
      const pts = (ans.IM1 === 5) + (ans.IM2 === 5) + (ans.IM3 === 5) + (ans.IM4 === 5) + (ans.IM5 === 1) + (ans.IM6 === 1);
      add('Impression management (0–6)', String(pts), pts >= 5 ? 'warn' : 'ok', 'Solo ricerca: nessuna correzione individuale.');
      if (pts >= 5) out.flags.push('molte risposte «perfette» (impression management alto)');
    }
    // sequenze identiche e tempi sugli item Likert in ordine di risposta
    const seq = S.seq.filter(c => { const q = byCode[c]; return q && isLik(q) && !q.pilot; });
    if (seq.length >= 10) {
      let best = 1, run = 1;
      for (let i = 1; i < seq.length; i++) { run = ans[seq[i]] === ans[seq[i - 1]] ? run + 1 : 1; best = Math.max(best, run); }
      add('Risposte identiche di fila (max)', String(best), best >= 10 ? 'warn' : 'ok', 'Soglia provvisoria: 10.');
      if (best >= 10) out.flags.push('sequenza di ' + best + ' risposte identiche');
    }
    const ts = seq.map(c => S.times[c]).filter(t => t != null && t < 90000).sort((a, b) => a - b);
    if (ts.length >= 10) {
      const med = ts[Math.floor(ts.length / 2)] / 1000;
      add('Tempo mediano per domanda', med.toFixed(1) + ' s', med < 1.5 ? 'warn' : 'ok', 'Soglia provvisoria: 1,5 s.');
      if (med < 1.5) out.flags.push('risposte molto rapide');
    }
    // tendenza ad essere d'accordo: quota di risposte ≥4 sugli item di scala (chiavi bilanciate → attesa ≈ 50%)
    const sq = Q.filter(q => isLik(q) && !q.pilot && q.block !== 'A4' && ans[q.code] != null);
    if (sq.length >= 20) {
      const share = sq.filter(q => ans[q.code] >= 4).length / sq.length;
      add('Quota di risposte «d\'accordo»', Math.round(share * 100) + '%', share > .7 || share < .25 ? 'warn' : 'ok',
        'Con item bilanciati ci si aspetta una quota intermedia.');
      if (share > .7) out.flags.push('tendenza ad essere d\'accordo con tutto');
    }
    // coerenza interna: scale con item + e R molto discordanti

<script>

(function () {

  });

  let S; try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };

  /* ---------- domande per blocco ---------- */
  const blkQs = id => Q.filter(q => q.block === id && !q.pilot);
  const active = q => q.code !== 'FU2' || S.answers.FU1 == null || S.answers.FU1 >= 1;
  const isAns = q => { const a = S.answers[q.code]; return a != null && (!Array.isArray(a) || a.length > 0); };
  function blockStat(id) {
    const qs = blkQs(id).filter(active), n = qs.filter(isAns).length;

  function progAll() {
    const prog = {}; let n = 0, t = 0;

  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  /* alterna i tratti: mai due item dello stesso gruppo di fila, se evitabile */
  function interleave(qs, rnd, keyOf) {
    const g = {}; qs.forEach(q => (g[keyOf(q)] = g[keyOf(q)] || []).push(q));
    Object.values(g).forEach(a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } });
    const out = []; let last = null;
    while (out.length < qs.length) {
      let keys = Object.keys(g).filter(k => g[k].length), cand = keys.filter(k => k !== last); if (!cand.length) cand = keys;
      const tot = cand.reduce((s, k) => s + g[k].length, 0); let r = rnd() * tot, pick = cand[0];

  function buildQueue() {
    const sel = C.blocks.map(b => b.id).filter(id => S.selected.includes(id)), rnd = mulberry(S.seed), items = [];
    const push = (blk, code) => items.push({ t: 'q', code, blk });
    sel.forEach(id => {

      let qs = blkQs(id); if (keyOf[id]) qs = interleave(qs, rnd, keyOf[id]);

  const cancelAuto = () => { clearTimeout(timer); timer = null; };

  function editQ(code) {
    const q = byCode[code]; edit = code; R = { queue: [{ t: q.fmt === 'INT4' ? 'int' : 'q', code, blk: q.block }], i: 0, sess: new Set() };
    go('edit'); tall(false); refreshCity(q.block, 800); hud(q.block); setTop('Modifica risposta', null);
    if (q.fmt === 'INT4') return intView(true);
    const e = edit; qView(); edit = e; $('#nextBtn').textContent = 'Salva e torna al sommario'; view = 'edit';
  }

  function exportJSON() {
    const sc = Sc.scales(S.answers), out = {
      versione: '0.4', esportato: new Date().toISOString(),
      risposte: Object.keys(S.answers).map(c => ({ codice: c, valore: S.answers[c], chiave: byCode[c].key, tempo_ms: S.times[c] || null })),
      sottocategorie: S.subs,
      punteggi: sc.filter(s => s.avail).map(s => ({ scala: s.def.label, punteggio: +s.score.toFixed(2), item: s.n + '/' + s.total, coerenza: s.coh })),
      formato_sociale: Sc.prefs(S.answers).filter(p => p.avail).map(p => ({ indice: p.def.label, valore: +p.score.toFixed(2) })),
      casa: Sc.home(S.answers).map(a => ({ area: a.def.name, come_vivo: a.live.avail ? +a.live.score.toFixed(2) : null, casa_ideale: a.ideal.avail ? +a.ideal.score.toFixed(2) : null, importanza: a.imp })),
      qualita: Sc.quality(S, sc)
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'CEnTRO_risposte_v0.4.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  /* ---------- avvio ---------- */
  City.init($('#city'), C.blocks);
  new ResizeObserver(() => City.resize()).observe($('#cityWrap'));
  const cw = $('#cityWrap'); let dx = null;
  cw.addEventListener('pointerdown', e => { if (view !== 'summary') return; dx = e.clientX; City.stopPan(); cw.setPointerCapture(e.pointerId); });
  cw.addEventListener('pointermove', e => { if (dx == null) return; City.drag(e.clientX - dx); dx = e.clientX; });
  cw.addEventListener('pointerup', () => dx = null);
  $('#backBtn').onclick = back; $('#menuBtn').onclick = () => setupView();
  window.__app = { get S() { return S; }, set S(v) { S = v; }, Sc, City, setupView, summaryView, save, startRun, get R() { return R; } };
  setupView();
})();

</script>
