<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coppie di Opposti — Analisi Target</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.18);
    --text: #f0ede8;
    --muted: #6b6a72;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --accent3: #f060c8;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  header {
    padding: 4rem 3rem 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(200,240,96,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 0.6rem;
  }

  .header-sub {
    font-size: 13px;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.7;
  }

  .header-count {
    position: absolute;
    right: 3rem; top: 4rem;
    font-family: var(--font-display);
    font-size: clamp(4rem, 10vw, 7rem);
    font-weight: 800;
    color: rgba(255,255,255,0.04);
    letter-spacing: -0.05em;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  /* Controls */
  .controls {
    padding: 1.5rem 3rem;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,14,15,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 14px 10px 40px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  .btn-export {
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-export:hover { opacity: 0.85; }
  .btn-export:active { transform: scale(0.97); }

  /* Category tabs */
  .cat-tabs {
    padding: 1rem 3rem;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .cat-tab {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .cat-tab:hover { border-color: var(--border-hover); color: var(--text); }

  .cat-tab.active {
    background: var(--accent);
    color: #0e0e0f;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* Status bar */
  .statusbar {
    padding: 0.6rem 3rem;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
  }

  .statusbar span { color: var(--accent); }

  /* Main grid */
  main {
    padding: 2rem 3rem 4rem;
  }

  .section { margin-bottom: 2.5rem; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
  }

  .section-label {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-num {
    font-size: 11px;
    color: var(--border-hover);
    font-family: var(--font-mono);
  }

  .pairs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 6px;
  }

  .pair {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s;
    cursor: default;
  }

  .pair:hover {
    border-color: var(--border-hover);
    background: var(--surface2);
  }

  .pair.highlight { border-color: rgba(200,240,96,0.4); background: rgba(200,240,96,0.04); }

  .pole {
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text);
  }

  .pole.left { text-align: right; }
  .pole.right { text-align: left; }

  .separator {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .sep-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--muted);
  }

  .sep-line {
    width: 12px;
    height: 1px;
    background: var(--border-hover);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 13px;
    display: none;
  }

  .empty.show { display: block; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  @media (max-width: 600px) {
    header, .controls, .cat-tabs, .statusbar, main { padding-left: 1.25rem; padding-right: 1.25rem; }
    header { padding-top: 2rem; }
    .header-count { display: none; }
    .pairs-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <p class="header-eyebrow">/ Analisi target /</p>
  <h1>Coppie<br>di opposti</h1>
  <p class="header-sub">Mappa delle dimensioni comportamentali, demografiche e psicografiche per la definizione del target.</p>
  <div class="header-count" id="total-count">0</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Cerca tra le coppie..." oninput="render()" />
  </div>
  <button class="btn-export" onclick="exportCsv()">↓ Esporta CSV</button>
</div>

<div class="cat-tabs" id="cat-tabs"></div>
<div class="statusbar" id="statusbar"></div>

<main id="main"></main>
<div class="empty" id="empty">Nessuna coppia trovata per questa ricerca.</div>

<script>
const DATA = [
  { cat: "Stile di vita", pairs: [
    ["Interno","Esterno (casa vs uscire)"],
    ["Sedentari","Sportivi"],
    ["Nottambuli","Mattinieri"],
    ["Minimalisti","Accumulatori"],
    ["Routinari","Avventurosi"],
    ["Salutisti","Indulgenti (cibo e abitudini)"],
    ["Vegetariani / vegani","Onnivori"],
    ["Astemi","Bevitori occasionali"],
    ["Non fumatori","Fumatori"],
    ["Meditatori","Non praticanti mindfulness"],
    ["Eco-sostenibili","Disinteressati all'ambiente"],
    ["Slow life","Fast life"],
  ]},
  { cat: "Personalità & socialità", pairs: [
    ["Introversi","Estroversi"],
    ["Emotivi","Razionali"],
    ["Impulsivi","Riflessivi"],
    ["Ottimisti","Pessimisti"],
    ["Conformisti","Anticonformisti"],
    ["Competitivi","Collaborativi"],
    ["Ambiziosi","Appagati del presente"],
    ["Ordinati","Caotici"],
    ["Empatici","Pragmatici"],
    ["Leader naturali","Follower"],
    ["Curiosi","Disinteressati"],
    ["Creativi","Analitici"],
    ["Solitari","Gregari"],
    ["Fiduciosi","Diffidenti"],
  ]},
  { cat: "Tecnologia & digitale", pairs: [
    ["Digitali","Analogici"],
    ["Esperti tech","Inesperti tech"],
    ["Early adopter","Tardi adottanti"],
    ["Mobile-first","Desktop-first"],
    ["Utenti iOS","Utenti Android"],
    ["Dipendenti dallo smartphone","Low-digital"],
    ["Gamer","Non gamer"],
    ["Utenti AI e assistenti vocali","Scettici dell'AI"],
    ["Attenti alla privacy digitale","Disattenti alla privacy"],
    ["Streamer di contenuti","Consumatori lineari (TV, radio)"],
    ["Abbonati a servizi digitali","Preferiscono acquisti una tantum"],
    ["Utenti multi-device","Utenti single-device"],
  ]},
  { cat: "Social media & contenuti", pairs: [
    ["Fruitori attivi di social media","In detox dai social"],
    ["Creatori di contenuti","Solo consumatori"],
    ["Micro-influencer","Utenti anonimi"],
    ["Seguaci di trend","Indifferenti ai trend"],
    ["Fan dei podcast","Preferiscono testo scritto"],
    ["Lettori di newsletter","Non iscritti a newsletter"],
    ["Fruitori di video brevi (Reels / TikTok)","Preferiscono video lunghi"],
    ["Fan degli audiobook","Lettori di libri fisici"],
    ["Utenti di community online","Preferiscono relazioni offline"],
    ["Appassionati di meme e cultura internet","Estranei alla cultura internet"],
  ]},
  { cat: "Lavoro & carriera", pairs: [
    ["Lavoratori dipendenti","Freelance / autonomi"],
    ["Imprenditori","Dipendenti strutturati"],
    ["Smart worker","In ufficio fisicamente"],
    ["Multitasker","Monotasker"],
    ["Annoiati al lavoro","Pienamente impegnati"],
    ["Creativi professionali","Profili tecnici e scientifici"],
    ["Manager e team leader","Esecutori"],
    ["Aspiranti professionisti","Professionisti affermati"],
    ["Part-time o stagionali","A tempo pieno"],
    ["Orientati alla carriera","Orientati al work-life balance"],
    ["Lavoratori digitali (knowledge workers)","Lavoratori manuali"],
    ["In cerca attiva di lavoro","Occupati stabili"],
    ["Startupper","Corporate employee"],
  ]},
  { cat: "Istruzione & conoscenza", pairs: [
    ["Istruiti (laurea o più)","Formazione tecnica e professionale"],
    ["Lettori abituali","Non lettori"],
    ["Autodidatti","Formazione istituzionale"],
    ["Studenti","Professionisti già formati"],
    ["Appassionati di scienza","Umanisti"],
    ["Poliglotti","Monolingua"],
    ["Aggiornati sulle news","Disinteressati all'attualità"],
    ["Appassionati di storia","Orientati al futuro e all'innovazione"],
    ["Frequentatori di corsi e workshop","Autosufficienti nella formazione"],
  ]},
  { cat: "Economia & consumo", pairs: [
    ["Alto reddito","Basso reddito"],
    ["Risparmiatori","Spendaccioni"],
    ["Investitori","Non investitori"],
    ["Abbonati a servizi premium","Cacciatori di gratuità"],
    ["Acquirenti d'impulso","Acquirenti pianificati"],
    ["Amanti del lusso","Orientati al low-cost"],
    ["Sostenitori dell'economia locale","Acquirenti globali e online"],
    ["Proprietari di casa","Affittuari"],
    ["Brand-loyal","Opportunisti (miglior prezzo)"],
    ["Consumatori consapevoli","Consumatori per abitudine"],
  ]},
  { cat: "Geografia & mobilità", pairs: [
    ["Urbani","Rurali"],
    ["Amanti della città","Amanti della natura"],
    ["Pendolari","Lavoratori sotto casa"],
    ["Viaggiatori frequenti","Stanziali"],
    ["Expat","Radicati nel territorio d'origine"],
    ["Auto-dipendenti","Utenti del trasporto pubblico"],
    ["Ciclisti urbani","Non ciclisti"],
    ["Residenti in grandi metropoli","Residenti in piccoli centri"],
    ["Turisti sistematici","Chi raramente viaggia"],
  ]},
  { cat: "Relazioni & famiglia", pairs: [
    ["Single","In coppia o sposati"],
    ["Genitori","Non genitori"],
    ["Caregiver di familiari","Non caregiver"],
    ["Conviventi","Chi vive da solo"],
    ["Con animali domestici","Senza animali domestici"],
    ["Famiglie allargate","Famiglie nucleari o individui"],
    ["Appena separati o divorziati","In relazione stabile da anni"],
    ["Genitori con figli piccoli","Genitori con figli adulti"],
  ]},
  { cat: "Organizzazioni & mercato", pairs: [
    ["Grandi corporation","PMI e startup"],
    ["Nonprofit / terzo settore","For profit"],
    ["B2B","B2C"],
    ["Settore pubblico","Settore privato"],
    ["Early stage startup","Aziende mature e consolidate"],
    ["Agenzie e studi professionali","Liberi professionisti"],
    ["Mercato globale","Mercato locale o di nicchia"],
    ["Decisori (C-level, manager)","Utenti finali operativi"],
  ]},
];

let activeCategory = "__all__";

function buildTabs() {
  const el = document.getElementById('cat-tabs');
  const cats = [{ id: "__all__", label: "Tutte" }, ...DATA.map(d => ({ id: d.cat, label: d.cat }))];
  el.innerHTML = cats.map(c =>
    `<button class="cat-tab ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">${c.label}</button>`
  ).join('');
}

function setCategory(id) {
  activeCategory = id;
  buildTabs();
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const main = document.getElementById('main');
  const empty = document.getElementById('empty');
  main.innerHTML = '';
  let total = 0;

  const filtered = activeCategory === "__all__" ? DATA : DATA.filter(d => d.cat === activeCategory);

  filtered.forEach(section => {
    const matching = section.pairs.filter(([a, b]) =>
      !q || a.toLowerCase().includes(q) || b.toLowerCase().includes(q) || section.cat.toLowerCase().includes(q)
    );
    if (!matching.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <span class="section-label">${section.cat}</span>
        <span class="section-line"></span>
        <span class="section-num">${matching.length}</span>
      </div>
      <div class="pairs-grid">
        ${matching.map(([a, b]) => `
          <div class="pair ${q && (a.toLowerCase().includes(q) || b.toLowerCase().includes(q)) ? 'highlight' : ''}">
            <span class="pole left">${highlight(a, q)}</span>
            <span class="separator"><span class="sep-dot"></span><span class="sep-line"></span><span class="sep-dot"></span></span>
            <span class="pole right">${highlight(b, q)}</span>
          </div>
        `).join('')}
      </div>
    `;
    main.appendChild(sec);
    total += matching.length;
  });

  document.getElementById('statusbar').innerHTML = `<span>${total}</span> coppie visualizzate${q ? ` per "<span>${q}</span>"` : ''}`;
  document.getElementById('total-count').textContent = total;
  empty.classList.toggle('show', total === 0);
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, `<mark style="background:rgba(200,240,96,0.25);color:var(--accent);border-radius:2px;padding:0 2px;">$1</mark>`);
}

function exportCsv() {
  const rows = [["Categoria","Polo A","Polo B"]];
  DATA.forEach(s => s.pairs.forEach(([a, b]) => rows.push([s.cat, a, b])));
  const csv = rows.map(r => r.map(c => `"${c.replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'coppie_opposti_target.csv'; a.click();
  URL.revokeObjectURL(url);
}

buildTabs();
render();
</script>
</body>
</html>
